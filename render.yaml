databases:
  - name: nexus-demo-db
    databaseName: nexus
    user: nexus
    plan: free
    region: oregon
    postgresMajorVersion: "16"

services:
  - type: web
    name: nexus-demo-api
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install -r backend/requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT "backend.app:create_app()"
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.11
      - key: DATABASE_URL
        fromDatabase:
          name: nexus-demo-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: SESSION_COOKIE_SECURE
        value: "true"
      - key: SESSION_COOKIE_SAMESITE
        value: "None"
      - key: FRONTEND_ORIGINS
        value: https://nexus-fullstack-1-lw0u.onrender.com
      - key: DARAJA_B2C_ENABLED
        value: "false"

  - type: web
    name: nexus-demo-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm ci --include=dev && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://nexus-fullstack-qk10.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
